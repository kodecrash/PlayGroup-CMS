                  - { label: "Banner Title", name: "title", widget: "string" }
                  - { label: "Banner Description", name: "description", widget: "text" }
                  - { label: "Primary Button Label", name: "primaryButtonText", widget: "string" }
                  - { label: "Primary Button Link", name: "primaryButtonLink", widget: "string" }
                  - { label: "Secondary Button Label", name: "secondaryButtonText", widget: "string", required: false }
                  - { label: "Secondary Button Link", name: "secondaryButtonLink", widget: "string", required: false }
              - label: "Custom Embed / HTML"
